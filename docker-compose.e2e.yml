services:
  postgres-e2e:
    image: postgres:15
    environment:
      POSTGRES_USER: dropvault_e2e
      POSTGRES_PASSWORD: e2e_password
      POSTGRES_DB: dropvault_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropvault_e2e -d dropvault_e2e"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis-e2e:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio-e2e:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: e2eadmin
      MINIO_ROOT_PASSWORD: e2epassword
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
  backend-e2e:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://dropvault_e2e:e2e_password@postgres-e2e:5432/dropvault_e2e
      REDIS_URL: redis://redis-e2e:6379/0
      MINIO_ENDPOINT: minio-e2e:9000
      MINIO_ACCESS_KEY: e2eadmin
      MINIO_SECRET_KEY: e2epassword
      MINIO_BUCKET_NAME: dropvault-e2e
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
      minio-e2e:
        condition: service_healthy
  frontend-e2e:
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend-e2e:8000
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - backend-e2e
