services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: dropvault_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: dropvault_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropvault_test -d dropvault_test"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis-test:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  minio-test:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: testadmin
      MINIO_ROOT_PASSWORD: testpassword
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15
  tests:
    build:
      context: ./backend
      target: test
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://dropvault_test:test_password@postgres-test:5432/dropvault_test
      REDIS_URL: redis://redis-test:6379/0
      MINIO_ENDPOINT: minio-test:9000
      MINIO_ACCESS_KEY: testadmin
      MINIO_SECRET_KEY: testpassword
      MINIO_BUCKET_NAME: dropvault-test
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=html:test-results/htmlcov --junitxml=test-results/junit.xml tests"
