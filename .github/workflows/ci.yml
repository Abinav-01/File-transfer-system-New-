name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install Python lint tool
        run: python -m pip install ruff==0.13.3
      - name: Backend lint
        run: ruff check backend/app backend/tests backend/alembic scripts
      - name: Backend format validation
        run: ruff format --check backend/app backend/tests backend/alembic scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

  backend-unit-api:
    name: Backend unit and API tests
    needs: static-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit and API tests with isolated services
        run: |
          docker compose -p dropvault-ci-unit -f docker-compose.test.yml run --build --rm tests \
            sh -c 'alembic upgrade head && mkdir -p test-results/unit-api && pytest -q tests/unit tests/api --cov=app --cov-branch --cov-report=term-missing --cov-report=html:test-results/unit-api/htmlcov --junitxml=test-results/unit-api/junit.xml'
      - name: Upload unit and API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-api-reports
          path: backend/test-results/unit-api/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove isolated test services
        if: always()
        run: docker compose -p dropvault-ci-unit -f docker-compose.test.yml down -v --remove-orphans

  integration:
    name: Integration tests
    needs: backend-unit-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgreSQL, Redis, and MinIO integration tests
        run: |
          docker compose -p dropvault-ci-integration -f docker-compose.test.yml run --build --rm tests \
            sh -c 'alembic upgrade head && mkdir -p test-results/integration && pytest -q tests/integration --cov=app --cov-branch --cov-report=term-missing --cov-report=html:test-results/integration/htmlcov --junitxml=test-results/integration/junit.xml'
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports
          path: backend/test-results/integration/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove isolated test services
        if: always()
        run: docker compose -p dropvault-ci-integration -f docker-compose.test.yml down -v --remove-orphans

  frontend-build:
    name: Frontend production build
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  e2e:
    name: Playwright browser journeys
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run isolated browser journeys
        run: python3 scripts/run_e2e.py
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  docker-validation:
    name: Docker build validation
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend celery-worker celery-beat frontend
